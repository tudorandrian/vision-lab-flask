[project]
name = "vision-lab-flask"
version = "1.0.0"
description = "Classical image processing and pretrained deep-learning vision models behind a small Flask web interface."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Tudor Andrian" }]
requires-python = ">=3.12,<3.14"
keywords = ["computer-vision", "image-processing", "flask", "opencv", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "flask>=3.1.3,<4",
    "numpy>=2.1,<3",
    # OpenCV 5 removed cv2.CascadeClassifier, which DeepFace's default face
    # detector still calls. Stay on 4.x until the emotion extra is verified on 5.x.
    "opencv-python>=4.10,<5",
    "pillow>=11.3,<13",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "waitress>=3.0.2,<4",
]

[project.optional-dependencies]
# AGPL-3.0 detector backend (Ultralytics YOLOv5u weights are downloaded on first use).
yolo = ["ultralytics>=8.4,<9"]
# Facial emotion analysis. Pulls in TensorFlow; off by default, see README "Privacy".
emotion = ["deepface>=0.0.95,<0.1", "tf-keras>=2.19,<3"]

[project.scripts]
vision-lab = "vision_lab.__main__:main"

[project.urls]
Repository = "https://github.com/tudorandrian/vision-lab-flask"
Changelog = "https://github.com/tudorandrian/vision-lab-flask/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "bandit>=1.9,<2",
    "mypy>=2.3,<3",
    "pip-audit>=2.10,<3",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-playwright>=0.9,<1",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_lab"]

# Without this, hatchling includes every file not excluded by .gitignore, which does not
# cover .git/info/exclude (where the local .superpowers/ workspace is excluded) or the
# instance/ directory a local run creates. List what belongs in a source distribution instead.
# Route B (Docker) must be followable from an unpacked sdist too, so this also carries the
# container and CI files, not just the wheel's own runtime code.
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "samples",
    "scripts",
    ".github",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
    "Dockerfile",
    "compose.yaml",
    ".editorconfig",
    ".gitattributes",
]

# CPU-only PyTorch wheels on every platform: the default Linux wheels bundle
# several gigabytes of CUDA libraries this project never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not models and not e2e'"
markers = [
    "models: downloads pretrained weights and runs real inference (opt in with -m models)",
    "e2e: drives a real browser against a live server (opt in with -m e2e)",
]
filterwarnings = ["error", "ignore::DeprecationWarning:werkzeug.*"]

[tool.coverage.run]
source = ["vision_lab"]
branch = true
omit = ["src/vision_lab/inference.py", "src/vision_lab/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PTH", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/vision_lab/catalog.py" = ["E501"]  # one reference per line reads better than wrapped prose
"tests/**" = ["S105", "S106", "S108", "S310"]
"scripts/**" = ["S310"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/vision_lab"]

[[tool.mypy.overrides]]
# Optional and heavyweight libraries are treated as untyped whether or not they are
# installed, so the result is the same on a laptop with every extra and in CI with none.
module = ["torch.*", "torchvision.*", "ultralytics.*", "deepface.*", "waitress.*"]
ignore_missing_imports = true
follow_imports = "skip"
