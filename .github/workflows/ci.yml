name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catches new advisories and upstream weight changes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with UV_VERSION in dependabot-requirements.yml (both must write the same
  # requirements.txt) and with the uv image in the Dockerfile.
  UV_VERSION: "0.12.15"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # astral-sh/setup-uv publishes no floating major tag, so this is pinned to a
      # release; Dependabot (github-actions) proposes updates.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run bandit -q -r src
      - run: uv run python scripts/check_text.py
      # requirements.txt is the plain-pip route (README, route C). It is exported from
      # uv.lock and must never drift from it; regenerate it after any lock change.
      - name: Check that requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.txt
          git diff --exit-code -- requirements.txt
      - run: uv run python scripts/gen_algorithms_doc.py --check
      # torch and torchvision carry a +cpu local version, which PyPI advisories cannot
      # match; pip-audit lists them as skipped. Dependabot alerts cover them instead.
      # scripts/pip_audit_retry.py retries when the PyPI vulnerability service fails (an
      # HTTP 5xx or a timeout), never when pip-audit reports a vulnerability.
      - run: uv run python scripts/pip_audit_retry.py --skip-editable
      # The step above only sees the base dependency set: `uv sync --locked` installs
      # no extras, so ultralytics, deepface, tensorflow, keras and gdown (the yolo and
      # emotion extras) are never audited. Export the full locked set instead, without
      # installing it, and audit that: --disable-pip stops pip-audit from ever running
      # pip, so this only reads pinned name/version pairs from uv.lock.
      - name: Export the full dependency set (all extras) for a vulnerability audit
        run: |
          uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes \
            -o "$RUNNER_TEMP/requirements-all.txt"
          # torch/torchvision's +cpu local version is not a PyPI release; see above.
          grep -v '+cpu' "$RUNNER_TEMP/requirements-all.txt" > "$RUNNER_TEMP/requirements-all-audit.txt"
      - run: uv run python scripts/pip_audit_retry.py --no-deps --disable-pip -r "$RUNNER_TEMP/requirements-all-audit.txt"

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest --cov --cov-report=term-missing

  models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: instance/weights
          key: weights-${{ hashFiles('src/vision_lab/inference.py') }}
      - run: uv sync --locked --extra yolo
      - run: uv run pytest -m models --no-cov

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e --no-cov

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t vision-lab-flask:ci .
      - name: Start the container and wait for a healthy status
        run: |
          docker run -d --name app -p 127.0.0.1:8000:8000 vision-lab-flask:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker logs app
          [ "$status" = "healthy" ]
          [ "$(docker exec app id -u)" = "10001" ]
          curl --fail --silent http://127.0.0.1:8000/healthz

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
