version: 2
updates:
  # requirements.txt is exported from uv.lock and CI fails when the two differ. On Dependabot's
  # uv pull requests the "Dependabot requirements" workflow re-exports it and pushes one commit;
  # approve the workflow runs on the pull request so CI checks that commit.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # OpenCV 5 removed cv2.CascadeClassifier, which DeepFace still calls. See pyproject.toml.
      - dependency-name: opencv-python
        update-types: [version-update:semver-major]
      # sympy 1.14 (required by torch) requires mpmath<1.4, so uv.lock cannot take 1.4.x and
      # Dependabot would only change requirements.txt. Remove once sympy allows mpmath 1.4.
      - dependency-name: mpmath
        versions: [">= 1.4"]
  # Workflows pin every action to a full commit SHA with its version as a comment
  # ("@<sha> # v7.0.1"); Dependabot updates both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image must stay inside requires-python (">=3.12,<3.14" in pyproject.toml).
      # Widen this when the project adds support for a newer Python.
      - dependency-name: python
        versions: [">= 3.14"]
