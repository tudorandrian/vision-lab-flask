version: 2
updates:
  # After any change to uv.lock (uv add, uv lock --upgrade, or a Dependabot update), run
  # `uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.txt` and commit the
  # result; CI fails when the two files disagree. Dependabot cannot run this step, so its pull
  # requests need this one extra commit before they pass.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # OpenCV 5 removed cv2.CascadeClassifier, which DeepFace still calls. See pyproject.toml.
      - dependency-name: opencv-python
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image must stay inside requires-python (">=3.12,<3.14" in pyproject.toml).
      # Widen this when the project adds support for a newer Python.
      - dependency-name: python
        versions: [">= 3.14"]
